name: Recipe book

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'content/**'
  workflow_dispatch:
  # Fired by the app when a published recipe changes (see src/libs/bookRebuild)
  repository_dispatch:
    types: [recipe-book-rebuild]

# A burst of edits makes one build: the newest run cancels the ones still going
concurrency:
  group: recipe-book
  cancel-in-progress: true

jobs:
  book:
    name: Build and publish the PDF
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # Public base URL of the R2 bucket the book photos are downloaded from
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
      # The book is built from the published recipes in the hosted database (read only)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The PDF goes to the private R2 book bucket. Paid members download it through a signed link.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BOOK_BUCKET: ${{ vars.R2_BOOK_BUCKET }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.x

      # Georgia is not on Linux runners. The book falls back to Times New Roman, and Liberation
      # Serif is metric-compatible with it, so line breaks and page count stay close to a local build.
      - name: Install pandoc and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc fonts-liberation
          fc-match 'Times New Roman'

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The browser download is cached, the system libraries it needs are not
      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build the PDF
        run: pnpm exec tsx scripts/buildBook.ts

      # Not a GitHub release: the repo is public, and the book is a paid download
      - name: Upload to the private book bucket
        run: pnpm exec tsx scripts/uploadBook.ts
