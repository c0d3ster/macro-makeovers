name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}

      - name: Build Next.js
        run: pnpm run build:ci
        env:
          # Build environment
          NODE_ENV: production

      - if: matrix.node-version == '22.x' && success()
        name: Cache Next.js build output
        uses: actions/cache/save@v5
        with:
          path: |
            .next
          key: nextjs-build-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

  static:
    strategy:
      matrix:
        node-version: [22.x]

    name: Run static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Retrieve Git history, needed to verify commits

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Linter
        run: pnpm run lint

      - name: Type checking
        run: pnpm run check:types
        env:
          # Build environment
          NODE_ENV: production

      - name: Check dependencies
        run: pnpm run check:deps

  unit:
    strategy:
      matrix:
        node-version: [22.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        uses: docker://mcr.microsoft.com/playwright:v1.63.0-noble
        with:
          args: sh -c "corepack enable pnpm && pnpm run test --run --project=unit --coverage"
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          # Test environment
          NODE_ENV: test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    strategy:
      matrix:
        node-version: [22.x]

    name: Run E2E tests
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - name: Build Next.js for E2E tests
        run: pnpm run build:ci
        env:
          # Build environment
          NODE_ENV: production

      - name: Run E2E tests
        uses: docker://mcr.microsoft.com/playwright:v1.63.0-noble
        with:
          args: sh -c "corepack enable pnpm && HOME=/root pnpm run test:e2e" # Set HOME to /root to avoid Playwright error with Firefox
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          # Test environment
          NODE_ENV: test

      - name: Fix test results permissions
        run: |
          sudo chmod -R 777 test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
